version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: greek_bot_db
    environment:
      POSTGRES_USER: greekbot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: greek_learning
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greekbot -d greek_learning"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - greek_bot_network

  bot:
    build: .
    container_name: greek_bot
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DATABASE_URL=postgresql+asyncpg://greekbot:${DB_PASSWORD}@postgres:5432/greek_learning
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google-credentials.json
      - LOG_LEVEL=INFO
    volumes:
      - ./audio_cache:/app/audio_cache
      - ./google-credentials.json:/app/google-credentials.json:ro
      - ./logs:/app/logs
    networks:
      - greek_bot_network

  admin:
    build: .
    container_name: greek_bot_admin
    command: python run_admin.py
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DATABASE_URL=postgresql+asyncpg://greekbot:${DB_PASSWORD}@postgres:5432/greek_learning
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google-credentials.json
      - DB_PASSWORD=${DB_PASSWORD}
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ./audio_cache:/app/audio_cache
      - ./google-credentials.json:/app/google-credentials.json:ro
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - greek_bot_network

networks:
  greek_bot_network:
    driver: bridge

volumes:
  postgres_data:
